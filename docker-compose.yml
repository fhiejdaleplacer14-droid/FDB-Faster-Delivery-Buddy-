name: fdb

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: development
  image: fdb-php:dev
  volumes:
    - ./backend:/var/www/html
    - composer:/tmp/composer-cache
  environment:
    COMPOSER_CACHE_DIR: /tmp/composer-cache
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *php
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    image: nginx:1.30.6-alpine
    ports:
      - "${FDB_API_PORT:-8000}:80"
    volumes:
      - ./backend/public:/var/www/html/public:ro
      - ./backend/storage/app/public:/var/www/media:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  queue:
    <<: *php
    command: php artisan queue:work redis --sleep=1 --tries=3 --max-time=3600
    restart: unless-stopped

  scheduler:
    <<: *php
    command: php artisan schedule:work
    restart: unless-stopped

  frontend:
    image: node:24.22.2-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_PROXY_TARGET: http://web
      VITE_USE_POLLING: "true"
    ports:
      - "${FDB_WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - web

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-fdb}
      POSTGRES_USER: ${DB_USERNAME:-fdb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fdb_local_only}
    ports:
      - "127.0.0.1:${FDB_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/create-testing-db.sh:/docker-entrypoint-initdb.d/10-create-testing-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.3-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  composer:
