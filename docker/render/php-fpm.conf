; Small pool for a 512 MB instance, listening on a private socket for nginx.
[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = /tmp/php-fpm.sock
listen.mode = 0660
pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 300
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
