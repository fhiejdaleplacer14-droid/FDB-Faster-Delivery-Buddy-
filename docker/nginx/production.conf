# Production: one origin serves the SPA, the API, and product photos, so Sanctum cookies need no CORS.
# TLS is terminated in front of this container (load balancer or reverse proxy).
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 12m;

    # Shared by every response below that does not set its own headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    location ~ ^/(api|sanctum|up)(/|$) {
        # The API returns JSON and downloads only: nothing may run, load, or frame it.
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_hide_header X-Powered-By;
    }

    # Public product photos. Production should move these to object storage or a CDN.
    location /storage/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Hashed build files never change, so browsers may keep them for a year.
    location /assets/ {
        root /usr/share/nginx/spa;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/spa;
        # The page itself is always revalidated so a deploy reaches everyone at once.
        add_header Cache-Control "no-cache";
        # frame-ancestors cannot be set from the page's meta tag, so it is sent here.
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
