<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You are offline · FDB</title>
    <style>
      :root { color-scheme: light dark; --bg: #fafaf8; --ink: #172033; --muted: #64748b; --blue: #2563eb; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b1120; --ink: #e2e8f0; --muted: #9ba8bf; --blue: #3b82f6; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, 'Segoe UI', sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 22px; margin: 20px 0 6px; }
      p { color: var(--muted); margin: 0 0 24px; max-width: 22rem; }
      button { background: var(--blue); color: #fff; border: 0; border-radius: 10px; padding: 12px 22px; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>FDB needs an internet connection to show stores and take orders. Check your signal, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
